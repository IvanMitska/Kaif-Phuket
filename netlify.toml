[build]
  command = "npm install --ignore-platform-reqs && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  CI = "true"
  NPM_FLAGS = "--prefer-offline --no-audit"
  ROLLUP_DISABLE_NATIVE = "true"
  # Оптимизация для производительности
  GENERATE_SOURCEMAP = "false"
  INLINE_RUNTIME_CHUNK = "false"
  IMAGE_INLINE_SIZE_LIMIT = "2000"

# Устанавливаем правила перенаправления для SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Базовые заголовки безопасности
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Кэширование статических ресурсов
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Кэширование JS и CSS файлов
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Кэширование шрифтов
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Кэширование изображений
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/images-optimized/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/images-webp/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Оптимизация производительности
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  minify = true

[build.processing.images]
  compress = true

# Плагины для дополнительной оптимизации
[[plugins]]
  package = "@netlify/plugin-lighthouse"
  [plugins.inputs]
    output_path = "reports/lighthouse.html"
    fail_deploy_on_score_thresholds = false
    thresholds.performance = 0.6
    thresholds.accessibility = 0.9
    thresholds.best-practices = 0.9
    thresholds.seo = 0.9 