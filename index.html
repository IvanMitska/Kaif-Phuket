    <!-- CRITICAL CSS: Inline above-the-fold styles for fast FCP -->
    <style>
      /* Base reset and layout */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;

      /* Loading screen - minimal styles */
      .app-loading {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.3s ease;
      }

      .app-loading.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .loader {
        width: 48px;
        height: 48px;
        border: 2px solid rgba(255,255,255,0.1);
        border-top: 2px solid rgba(255,255,255,0.8);
        border-radius: 50%;
        animation: spinner 0.8s linear infinite;
      }

      @keyframes spinner {
        to { transform: rotate(360deg); }
      }

      /* Critical hero styles for LCP */
      section {
        position: relative;
        width: 100%;
      }

      img {
        max-width: 100%;
        height: auto;
        display: block;
      }

      /* Prevent layout shift for images */
      img[width][height] {
        aspect-ratio: attr(width) / attr(height);
      }

      /* Fast image loading */
      img[loading="lazy"] {
        content-visibility: auto;
      }

      /* Font loading optimization */
      .fonts-loading body {
        visibility: hidden;
      }

      .fonts-loaded body,
      .no-js body {
        visibility: visible;
      }
    </style>

    <!-- CRITICAL INLINE JAVASCRIPT: Hero functionality for instant interactivity -->
    <script>
      // PERFORMANCE: Inline critical JavaScript to avoid render-blocking

      // 1. Preload critical resources
      (function() {
        // Mark fonts as loaded to prevent FOIT
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function() {
            document.documentElement.classList.add('fonts-loaded');
          });
        } else {
          // Fallback for older browsers
          setTimeout(function() {
            document.documentElement.classList.add('fonts-loaded');
          }, 100);
        }
      })();

      // 2. Remove loading screen when content is interactive
      (function() {
        var removeLoader = function() {
          var loader = document.querySelector('.app-loading');
          if (loader) {
            loader.classList.add('hidden');
            setTimeout(function() { loader.remove(); }, 300);
          }
        };

        // Try to remove after DOMContentLoaded
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() {
            setTimeout(removeLoader, 500);
          });
        } else {
          setTimeout(removeLoader, 500);
        }
      })();

      // 3. Prefetch next page assets on hover (intelligent prefetching)
      (function() {
        var prefetched = {};
        var prefetch = function(url) {
          if (prefetched[url]) return;
          prefetched[url] = true;
          var link = document.createElement('link');
          link.rel = 'prefetch';
          link.href = url;
          document.head.appendChild(link);
        };

        // Prefetch on link hover
        setTimeout(function() {
          document.addEventListener('mouseover', function(e) {
            var target = e.target;
            if (target.tagName === 'A' && target.href && target.href.startsWith(window.location.origin)) {
              prefetch(target.href);
            }
          }, { passive: true });
        }, 2000);
      })();

      // 4. Optimize image loading
      (function() {
        // Lazy load images with IntersectionObserver
        if ('IntersectionObserver' in window) {
          var imageObserver = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
              if (entry.isIntersecting) {
                var img = entry.target;
                if (img.dataset.src) {
                  img.src = img.dataset.src;
                  img.removeAttribute('data-src');
                }
                if (img.dataset.srcset) {
                  img.srcset = img.dataset.srcset;
                  img.removeAttribute('data-srcset');
                }
                imageObserver.unobserve(img);
              }
            });
          }, { rootMargin: '50px' });

          // Observe lazy images when DOM is ready
          setTimeout(function() {
            document.querySelectorAll('img[data-src], img[data-srcset]').forEach(function(img) {
              imageObserver.observe(img);
            });
          }, 100);
        }
      })();

      // 5. Performance monitoring (for debugging)
      if (typeof PerformanceObserver !== 'undefined' && !window.location.host.includes('localhost')) {
        try {
          // Monitor LCP
          var lcpObserver = new PerformanceObserver(function(list) {
            var entries = list.getEntries();
            var lastEntry = entries[entries.length - 1];
            console.log('LCP:', lastEntry.renderTime || lastEntry.loadTime);
          });
          lcpObserver.observe({ entryTypes: ['largest-contentful-paint'] });

          // Monitor FID
          var fidObserver = new PerformanceObserver(function(list) {
            list.getEntries().forEach(function(entry) {
              console.log('FID:', entry.processingStart - entry.startTime);
            });
          });
          fidObserver.observe({ entryTypes: ['first-input'] });

          // Monitor CLS
          var clsScore = 0;
          var clsObserver = new PerformanceObserver(function(list) {
            list.getEntries().forEach(function(entry) {
              if (!entry.hadRecentInput) {
                clsScore += entry.value;
                console.log('CLS:', clsScore);
              }
            });
          });
          clsObserver.observe({ entryTypes: ['layout-shift'] });
        } catch (e) {
          // Silently fail in production
        }
      }
    </script>
