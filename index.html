<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon для разных устройств и браузеров -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2024" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2024" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2024" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2024" />
    <link rel="shortcut icon" href="/favicon.ico?v=2024" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kaif: престижный курорт и оздоровительный комплекс с рестораном, спа, баней и спортивным залом" />
    <meta name="theme-color" content="#FFFFFF" />
    
    <!-- Принудительное обновление favicon -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- Предзагрузка критических ресурсов -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Preload key assets -->
    <link rel="preload" href="/assets/fonts/main-font.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.netlify.com">
    
    <!-- Определение поддержки WebP -->
    <script>
      // Проверяем поддержку WebP для использования оптимизированных изображений
      (function() {
        var WebP = new Image();
        WebP.onload = WebP.onerror = function() {
          document.documentElement.classList.add(WebP.height === 1 ? 'webp' : 'no-webp');
        };
        WebP.src = 'data:image/webp;base64,UklGRiQAAABXRUJQVlA4IBgAAAAwAQCdASoBAAEAAwA0JaQAA3AA/vuUAAA=';
      })();
    </script>
    
    <!-- Первоначальные стили для предотвращения мерцания -->
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        opacity: 1;
        transition: opacity 0.2s;
        background: #f5f5f5;
      }
      
      .app-loading {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        z-index: 1000;
        opacity: 1;
        transition: opacity 0.3s ease;
      }
      
      .app-loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      .loader {
        width: 60px;
        height: 60px;
        border: 3px solid #f0f0f0;
        border-top: 3px solid #90B3A7;
        border-radius: 50%;
        animation: spinner 1s linear infinite;
      }
      
      @keyframes spinner {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .no-js .app-loading {
        display: none;
      }
      
      /* Предотвращаем мерцание при загрузке изображений */
      img[loading="lazy"] {
        opacity: 0;
        transition: opacity 0.3s;
      }
      
      img.loaded {
        opacity: 1;
      }
    </style>
    
    <!-- Preload critical logos first (highest priority) -->
    <link rel="preload" as="image" href="/images/logos/logo-header-1x.webp">
    <link rel="preload" as="image" href="/images/logos/logo-header-1x.png">
    
    <!-- Preload critical images for Banya -->
    <link rel="preload" as="image" href="/images-webp/small/banya/panoramic.webp" media="(max-width: 767px)">
    <link rel="preload" as="image" href="/images-webp/medium/banya/panoramic.webp" media="(min-width: 768px) and (max-width: 1023px)">
    <link rel="preload" as="image" href="/images-webp/large/banya/panoramic.webp" media="(min-width: 1024px)">
    

    
    <!-- Preload hero images for restaurant -->
    <link rel="preload" as="image" href="/images-webp/small/menu/breakfast/kaif-breakfast.webp" media="(max-width: 768px)">
    <link rel="preload" as="image" href="/images-webp/medium/menu/breakfast/kaif-breakfast.webp" media="(min-width: 769px)">
    
    <!-- Preload logos -->
    <link rel="preload" as="image" href="/images-webp/logos/logo-header.webp">
    
    <!-- Google Fonts with display=swap for better performance -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    
    <title>KAIF | Jungle Club & Spa</title>
    
    <!-- Google Tag Manager -->
    <script>
    (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id=GTM-5WP6GKBQ';f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-5WP6GKBQ');
    </script>
    <!-- End Google Tag Manager -->
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5WP6GKBQ"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    
    <noscript>
      <div style="padding: 20px; text-align: center; background: #f5f5f5; color: #333;">
        Для работы сайта необходимо включить JavaScript
      </div>
    </noscript>
    
    <div class="app-loading">
      <div class="loader"></div>
    </div>
    
    <div id="root"></div>
    
    <script>
      // Удаляем прелоадер после загрузки приложения
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          const loader = document.querySelector('.app-loading');
          if (loader) loader.classList.add('hidden');
        }, 800);
      });
      
      // Маркируем загруженные изображения для плавных переходов
      document.addEventListener('load', function(e) {
        if (e.target.tagName === 'IMG') {
          e.target.classList.add('loaded');
        }
      }, true);
    </script>
    
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
