<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kaif: престижный курорт и оздоровительный комплекс с рестораном, спа, баней и спортивным залом" />
    <meta name="theme-color" content="#90B3A7" />
    
    <!-- Предзагрузка критических ресурсов -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Preload key assets -->
    <link rel="preload" href="/assets/fonts/main-font.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.netlify.com">
    
    <!-- Определение поддержки WebP -->
    <script>
      // Проверяем поддержку WebP для использования оптимизированных изображений
      (function() {
        var WebP = new Image();
        WebP.onload = WebP.onerror = function() {
          document.documentElement.classList.add(WebP.height === 1 ? 'webp' : 'no-webp');
        };
        WebP.src = 'data:image/webp;base64,UklGRiQAAABXRUJQVlA4IBgAAAAwAQCdASoBAAEAAwA0JaQAA3AA/vuUAAA=';
      })();
    </script>
    
    <!-- Первоначальные стили для предотвращения мерцания -->
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        opacity: 1;
        transition: opacity 0.2s;
        background: #f5f5f5;
      }
      
      .app-loading {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        z-index: 1000;
        opacity: 1;
        transition: opacity 0.3s ease;
      }
      
      .app-loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      .loader {
        width: 60px;
        height: 60px;
        border: 3px solid #f0f0f0;
        border-top: 3px solid #90B3A7;
        border-radius: 50%;
        animation: spinner 1s linear infinite;
      }
      
      @keyframes spinner {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .no-js .app-loading {
        display: none;
      }
      
      /* Предотвращаем мерцание при загрузке изображений */
      img[loading="lazy"] {
        opacity: 0;
        transition: opacity 0.3s;
      }
      
      img.loaded {
        opacity: 1;
      }
    </style>
    
    <title>Kaif: премиальный курорт, спа и ресторан</title>
  </head>
  <body>
    <noscript>
      <div style="padding: 20px; text-align: center; background: #f5f5f5; color: #333;">
        Для работы сайта необходимо включить JavaScript
      </div>
    </noscript>
    
    <div class="app-loading">
      <div class="loader"></div>
    </div>
    
    <div id="root"></div>
    
    <script>
      // Удаляем прелоадер после загрузки приложения
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          const loader = document.querySelector('.app-loading');
          if (loader) loader.classList.add('hidden');
        }, 800);
      });
      
      // Маркируем загруженные изображения для плавных переходов
      document.addEventListener('load', function(e) {
        if (e.target.tagName === 'IMG') {
          e.target.classList.add('loaded');
        }
      }, true);
    </script>
    
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
