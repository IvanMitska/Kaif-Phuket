    <!-- Первоначальные стили для предотвращения мерцания -->
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        opacity: 1;

      }
      
      .app-loading {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        z-index: 1000;
        opacity: 1;
        transition: opacity 0.3s ease;
      }
      
      .app-loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      .loader {
        width: 60px;
        height: 60px;
        border: 3px solid #f0f0f0;
        border-top: 3px solid #90B3A7;
        border-radius: 50%;
        animation: spinner 1s linear infinite;
      }
      
      @keyframes spinner {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .no-js .app-loading {
        display: none;
      }
      
      /* Предотвращаем мерцание при загрузке изображений */
      img[loading="lazy"] {
        opacity: 0;
        transition: opacity 0.3s;
      }
      
      img.loaded {
        opacity: 1;
      }
    </style>
